name: Build Forge 1.20.1 Mod JAR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Find newest ZIP and extract project
      - name: Find and extract newest ZIP
        shell: bash
        run: |
          shopt -s nullglob
          zips=(*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP found. Using repository root."
            echo "SRC=." >> "$GITHUB_ENV"
          else
            newest=""
            best=-1

            for z in "${zips[@]}"; do
              t=$(git log -1 --format=%ct -- "$z")
              t=${t:-0}

              if [ "$t" -gt "$best" ] || \
                { [ "$t" -eq "$best" ] && [[ "$z" > "$newest" ]]; }; then
                best=$t
                newest=$z
              fi
            done

            echo "Selected ZIP: $newest"

            mkdir -p project
            unzip -q -o "$newest" -d project

            # Find the actual Gradle project root
            gradle_file=$(find project -name build.gradle -type f | head -n 1)

            if [ -z "$gradle_file" ]; then
              echo "ERROR: build.gradle not found in ZIP"
              exit 1
            fi

            SRC="$(dirname "$gradle_file")"

            if [ ! -d "$SRC/src/main/java" ]; then
              echo "ERROR: Java source directory not found"
              exit 1
            fi

            echo "Using project directory: $SRC"
            echo "SRC=$SRC" >> "$GITHUB_ENV"
          fi

      # 3. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
          cache-disabled: true

      # 5. Build Forge mod
      - name: Build JAR
        working-directory: ${{ env.SRC }}
        run: |
          echo "Building Forge 1.20.1 mod..."
          gradle clean build \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # 6. Show generated JAR files
      - name: List generated JARs
        working-directory: ${{ env.SRC }}
        run: |
          echo "Generated JAR files:"
          ls -lh build/libs/*.jar

      # 7. Upload compiled mod
      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlantMegaPack-Forge-1.20.1
          path: ${{ env.SRC }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
